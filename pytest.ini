[pytest]
# Directorio raiz de los tests
testpaths = tests

# Mostrar prints durante los tests (util para debug)
# Quitar -s en CI para output limpio
addopts = -v --tb=short

# Patrones de archivos de test
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Markers personalizados
markers =
    unit: pruebas unitarias puras (sin BD ni Redis)
    integration: pruebas de integracion (con cliente Flask)
    slow: pruebas lentas (requieren servicios externos)